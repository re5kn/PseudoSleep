name: Test and Web export

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot ${{ env.GODOT_VERSION }} and export templates
        run: |
          set -e
          TAG="${GODOT_VERSION}-stable"
          BASE="https://github.com/godotengine/godot-builds/releases/download/${TAG}"
          wget -q "${BASE}/Godot_v${TAG}_linux.x86_64.zip"
          wget -q "${BASE}/Godot_v${TAG}_export_templates.tpz"
          unzip -q "Godot_v${TAG}_linux.x86_64.zip"
          sudo mv "Godot_v${TAG}_linux.x86_64" /usr/local/bin/godot
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TEMPLATE_DIR"
          unzip -q "Godot_v${TAG}_export_templates.tpz"
          mv templates/* "$TEMPLATE_DIR/"
          godot --version

      - name: Import project
        run: godot --headless --import || true

      - name: Run logic tests
        run: |
          godot --headless -s res://tests/test_sim.gd 2>&1 | tee test.log
          grep -q "ALL TESTS PASSED" test.log
          ! grep -E "SCRIPT ERROR|Parse Error" test.log

      - name: Check scripts load
        run: |
          godot --headless --quit-after 30 2>&1 | tee run.log
          ! grep -E "SCRIPT ERROR|Parse Error|Failed to load script" run.log

      - name: Export Web
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html 2>&1 | tee export.log
          test -f build/web/index.html
          test -f build/web/index.wasm
          ls -la build/web

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: build/web

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
